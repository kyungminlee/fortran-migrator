# PBBLAS -- distributed PB-BLAS kernels used by PBLAS.
# Pure Fortran fixed-form files. These call BLACS communication
# routines (DGEBR2D, DGEBS2D, etc.) and serial BLAS routines.
library: pbblas
language: fortran
source_dir: extern/scalapack-2.2.3/PBLAS/SRC/PBBLAS
extensions: [.f]

depends:
  - blas.yaml
  - blacs.yaml

# PBBLAS files also reference PTZBLAS routines (DAGEMV, etc.).
#
# TOOLS/ is scanned for the same reason: PBBLAS' pb*tran / pb*trnv /
# pb*trsrt / pb*trget / pb*trst1 call NUMROC / ICEIL / ILCM, which are
# precision-independent integer helpers living in ScaLAPACK's TOOLS/
# tree. Scanning puts them in the symbol universe so the call sites
# pass through unrenamed; PBBLAS does not migrate them. They are
# *defined* in scalapack_common, which is what PBBLAS' downstreams
# link — see the force_common note in scalapack.yaml. Scanning TOOLS
# directly rather than depending on scalapack.yaml keeps the symbol
# universe to what PBBLAS actually needs: a depends edge would pull in
# all of SRC/ and REDIST/ and rewrite the rename map with it.
extra_symbol_dirs:
  - extern/scalapack-2.2.3/PBLAS/SRC/PTZBLAS
  - extern/scalapack-2.2.3/TOOLS

skip_files: []

# Task 44: rename the MKL-colliding, family-independent support symbols
# name -> ep_name in the migrated output (shared manifest; the nm audit
# gate reads the same file). Full rationale and mechanics:
# codegen/migrator/privatize.py module docstring.
privatize_symbols: privatize_ep_symbols.txt
