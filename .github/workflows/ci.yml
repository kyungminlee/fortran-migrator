name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Migrator unit tests (fast) ───────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run unit tests
        run: uv run pytest test/unit -q

  # ── Documentation build check ────────────────────────────────────
  # Same recipe as docs.yml (GitHub Pages) via the shared composite
  # action, so a Sphinx breakage is caught on push instead of after a
  # merge to main.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-docs

  # ── Stage + library build, one representative slot ───────────────
  # kind10 + gfortran-15 + Intel MPI, libraries only (no test
  # harness, no ctest): the per-push signal is "the migrator stages
  # and the staged stack compiles". Intel MPI because it is the
  # canonical MPI for the migrated stack (the libmpiseq path is
  # written against Intel MPI's handle ABI). Correctness testing and
  # the full target x compiler x MPI matrix stay in release.yml.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Extract vendored sources
        run: |
          cd extern
          [ -d lapack-3.12.1 ] || tar xzf lapack-3.12.1.tar.gz
          [ -d scalapack-2.2.3 ] || tar xzf scalapack-2.2.3.tar.gz

      # Same toolchain steps release.yml's matrix runs, via the shared
      # composite action.
      - uses: ./.github/actions/setup-toolchain
        with:
          gcc-packages: gcc-15 g++-15 gfortran-15
          intel-mpi: 'true'
          fc: gfortran-15
          cc: gcc-15
          cxx: g++-15

      - name: Stage kind10
        run: |
          uv run python -m migrator stage \
            ${{ github.workspace }}/staging \
            --target kind10

      - name: Configure
        run: |
          cmake -S staging -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran-15 \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_CXX_COMPILER=g++-15 \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix \
            -DMIGRATOR_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      # ── Installed-package consumer guard ─────────────────────────
      # Building is not the same as being consumable. The in-tree
      # build compiles everything under one project() that enables
      # Fortran, C and C++ together and links through the gfortran
      # driver, so it cannot see a defect that only bites a consumer
      # missing one of those languages — which is what every defect
      # in the install/export path has been. See test/consume/README.md.
      - name: Install
        run: cmake --install build

      - name: Consume from a Fortran-only project
        run: |
          cmake -S test/consume/fortran -B build-consume-fortran \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_Fortran_COMPILER=gfortran-15 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
          cmake --build build-consume-fortran
          ./build-consume-fortran/consume_fortran

      - name: Consume from a C-only project
        run: |
          cmake -S test/consume/c -B build-consume-c \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
          cmake --build build-consume-c
          ./build-consume-c/consume_c

      # The escape hatch: a C-only project reaching a Fortran package by
      # naming the ABI tag. Note no -lgfortran anywhere — the package
      # carries the producer's Fortran runtime for exactly this case.
      - name: Consume a Fortran package from C via EPLINALG_FORTRAN_TAG
        run: |
          cmake -S test/consume/c-fortran-tag -B build-consume-c-tag \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-15 \
            -DEPLINALG_FORTRAN_TAG=gfortran-15 \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix
          cmake --build build-consume-c-tag
          ./build-consume-c-tag/consume_c_fortran_tag
